# Development Docker Compose - Database only
# Run backend services locally for faster development

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: marketing-saas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketing_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketing-saas-network

volumes:
  postgres_data:
    driver: local

networks:
  marketing-saas-network:
    driver: bridge
