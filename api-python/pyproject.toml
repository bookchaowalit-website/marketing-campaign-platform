[tool.poetry]
name = "marketing-saas-api-python"
version = "1.0.0"
description = "Python FastAPI backend for Marketing SaaS platform"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.158.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
sqlalchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
pydantic = "^2.14.1"
pydantic-settings = "^2.16.1"
python-dotenv = "^1.2.4"
grpcio = "^1.84.0"
grpcio-tools = "^1.84.0"
pyjwt = "^2.15.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.32"
httpx = "^0.28.1"
pandas = "^2.2.3"
scikit-learn = "^1.5.2"
numpy = "^1.26.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
